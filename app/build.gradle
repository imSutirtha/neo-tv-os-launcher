plugins {
    alias(libs.plugins.android.application)
}

def versionMajor = 1
def versionMinor = 0
def versionPatch = 0
def versionClassifier = "BETA"
def isSnapshot = false
def minimumSdkVersion = 28

def generateVersionCode = { ->
    return minimumSdkVersion * 10000000 + versionMajor * 10000 + versionMinor * 100 + versionPatch
}

def generateVersionName = { ->
    def classifier = versionClassifier
    if (classifier == null && isSnapshot) {
        classifier = "SNAPSHOT"
    }
    def name = "${versionMajor}.${versionMinor}.${versionPatch}"
    if (classifier != null && !classifier.isEmpty()) {
        name += "-${classifier}"
    }
    return name
}

android {
    namespace 'com.darkgod.devtools.neo_tvos'
    compileSdk 37

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.darkgod.devtools.neo_tvos')
        minSdk minimumSdkVersion
        targetSdk 37
        versionCode generateVersionCode()
        versionName generateVersionName()
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.recyclerview
    implementation libs.androidx.dynamicanimation
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation libs.junit
}
